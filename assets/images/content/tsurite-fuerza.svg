<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Judoka de perfil, de la cabeza al abdomen, mirando a la derecha -->
    <g id="bust" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-30 168 L-30 340 L30 340 L30 168 A30 30 0 0 0 -30 168 Z" fill="#F6F2E7" stroke="none"/>
      <path d="M-30 322 L30 322" stroke="#A98B5E" stroke-width="14" stroke-linecap="butt"/>
      <path d="M8 138 L14 220 L22 322" stroke="#1B2338" stroke-opacity=".45" stroke-width="3"/>
      <path d="M2 120 L2 142" stroke="#D6BD8C" stroke-width="14"/>
      <circle cx="4" cy="100" r="24" fill="#D6BD8C" stroke="none"/>
      <path d="M-20 102 A24 24 0 0 1 26 92 Q2 94 -8 114 Z" fill="#141a2b" stroke="none"/>
    </g>
  </defs>
  <rect width="800" height="460" fill="#1B2338"/>
  <text x="40" y="44" font-size="17" fill="#888D95" letter-spacing="2">TSURITE · FUERZA DE ELEVACIÓN</text>

  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="translate(10 0)"><!-- 1 -->
    <use href="#bust" x="130"/>
    <path d="M140 172 L205 190 L268 206" stroke="#1B2338" stroke-width="27"/>
    <path d="M140 172 L205 190 L268 206" stroke="#F6F2E7" stroke-width="22"/>
    <circle cx="270" cy="207" r="11" fill="#D6BD8C" stroke="none"/>
    <path d="M270 180 L270 160" stroke="#888D95" stroke-width="4"/>
    <path d="M262 168 L270 158 L278 168" stroke="#888D95" stroke-width="4"/>

    </g><!-- 2 -->
    <use href="#bust" x="400"/>
    <path d="M410 172 L448 238 L490 178" stroke="#1B2338" stroke-width="27"/>
    <path d="M410 172 L448 238 L490 178" stroke="#F6F2E7" stroke-width="22"/>
    <circle cx="492" cy="176" r="11" fill="#D6BD8C" stroke="none"/>
    <path d="M492 152 L492 112" stroke="#A98B5E" stroke-width="5"/>
    <path d="M482 124 L492 110 L502 124" stroke="#A98B5E" stroke-width="5"/>

    <g transform="translate(-20 0)"><!-- 3 -->
    <use href="#bust" x="670"/>
    <path d="M680 172 L700 250 L708 172" stroke="#1B2338" stroke-width="27"/>
    <path d="M680 172 L700 250 L708 172" stroke="#F6F2E7" stroke-width="22"/>
    <circle cx="709" cy="170" r="11" fill="#D6BD8C" stroke="none"/>
    <path d="M709 146 L709 70" stroke="#D6BD8C" stroke-width="6"/>
    <path d="M697 84 L709 66 L721 84" stroke="#D6BD8C" stroke-width="6"/>
    </g>
  </g>

  <g font-size="22" font-weight="700" letter-spacing="1" text-anchor="middle">
    <text x="160" y="392" fill="#888D95">DÉBIL</text>
    <text x="420" y="392" fill="#A98B5E">INTERMEDIA</text>
    <text x="670" y="392" fill="#D6BD8C">FUERTE</text>
  </g>
  <g font-size="17" fill="#F6F2E7" text-anchor="middle">
    <text x="160" y="418">Brazo extendido</text>
    <text x="420" y="418">Codo a medio camino</text>
    <text x="670" y="418" font-size="16">Codo al cuerpo, mano encima</text>
  </g>
</svg>
