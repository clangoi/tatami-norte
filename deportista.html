<!doctype html>
<html lang="es">
<head>
<!--
  PANEL DEL DEPORTISTA (ver DEPORTISTAS.md)
  Mismo esquema que el panel de administración (admin.html): barra superior, cabecera con pestañas y listas.
  La cuenta la crea el equipo desde admin → Deportistas y la persona crea su clave con el enlace que recibe
  por correo. Aquí agenda, reagenda y cancela sus clases, ve su calendario e historial y suscribe sus
  reservas a su calendario personal.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B2338">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title data-site-title="Mi panel">Mi panel · Escuela de Artes Marciales Kizuna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/articulo.css">
<link rel="stylesheet" href="css/pages/admin.css">
<link rel="stylesheet" href="css/pages/deportista.css">
</head>
<body>
<nav class="nav" aria-label="Panel">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="brand-mark" data-site="initial">K</span><span class="brand-name">Mi panel <span data-site="shortName">Kizuna</span></span></a>
    <div class="adm-nav">
      <span class="adm-user" id="who" hidden></span>
      <a class="btn small ghost" href="index.html">Ver sitio</a>
      <button class="btn small ghost" id="logout" type="button" hidden>Salir</button>
    </div>
  </div>
</nav>

<main class="adm">

  <!-- Cargando sesión -->
  <section class="wrap adm-center" id="vLoading">
    <p class="adm-loading">Conectando…</p>
  </section>

  <!-- Inicio de sesión -->
  <section class="wrap adm-center" id="vLogin" hidden>
    <form class="panel adm-login" id="loginForm" novalidate>
      <h3>Entrar a mi panel</h3>
      <p class="hint">Tu cuenta la crea la escuela con el correo con el que te inscribes. Recibes un correo con el enlace para crear tu clave.</p>
      <div class="field"><label for="lEmail">Correo</label><input id="lEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lPass">Clave</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <div class="err" id="lErr" role="alert"></div>
      <button class="btn block" type="submit">Entrar</button>
      <button class="adm-link" id="forgot" type="button">Olvidé mi clave</button>
    </form>
  </section>

  <!-- Sin acceso -->
  <section class="wrap adm-center" id="vDenied" hidden>
    <div class="panel adm-login">
      <h3>Sin acceso</h3>
      <p class="hint" id="deniedMsg"></p>
      <button class="btn ghost block" type="button" id="deniedOut">Salir</button>
    </div>
  </section>

  <!-- Panel -->
  <section id="vApp" hidden>
    <div class="wrap adm-head">
      <div><div class="eyebrow" id="hello">Deportista</div><h1>Mi panel</h1></div>
      <div class="filters" role="tablist" aria-label="Secciones" id="tabs"></div>
    </div>
    <div class="wrap" id="body"></div>
  </section>
</main>

<div class="toast" id="toast" hidden role="status"></div>

<script src="site.config.js"></script>
<script src="js/site.js"></script>
<script type="module" src="js/deportista.js"></script>
</body>
</html>
