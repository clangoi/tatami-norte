  <g font-weight="700" letter-spacing="1" text-anchor="middle">
    <text x="460" y="50" font-size="22" fill="#A98B5E">TRACCIÓN DEL HIKITE</text>
    <text x="400" y="472" font-size="19" font-weight="400" fill="#F6F2E7">La mano marca la dirección; el tronco entero pone la fuerza.</text>
  </g>
