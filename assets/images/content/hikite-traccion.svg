    <g transform="rotate(-14 480 425)">
      <use href="#jk" transform="translate(713 0) scale(-1 1)" color="#888D95"/>
      <g transform="translate(713 0) scale(-1 1)">
        <path d="M200 170 L214 232 L232 292" stroke="#1B2338" stroke-width="27"/>
        <path d="M200 170 L214 232 L232 292" stroke="#888D95" stroke-width="22"/>
        <circle cx="233" cy="298" r="10" fill="#D6BD8C" stroke="none"/>
      </g>
    </g>
    <!-- Tori -->
    <use href="#jk" transform="translate(77 0)" color="#F6F2E7"/>
    <path d="M274 166 L316 262 L448 266" stroke="#1B2338" stroke-width="27"/>
    <path d="M274 166 L316 262 L448 266" stroke="#F6F2E7" stroke-width="22"/>
    <path d="M292 164 L330 232 L420 195" stroke="#1B2338" stroke-width="27"/>
